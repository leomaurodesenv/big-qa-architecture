[project]
name = "big-qa-architecture"
version = "2.0.1"
description = "Safeguarding BigQA Architecture"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate~=1.12.0",
    "datasets~=4.4.1",
    "eetq~=1.0.0",
    "huggingface-hub~=0.36.0",
    "openvino~=2025.3.0",
    "optimum~=2.0.0",
    "optimum-intel~=1.26.1",
    "scikit-learn~=1.7.2",
    "tensorflow~=2.20.0",
    "tf-keras~=2.20.1",
    "tokenizers~=0.21.4",
    "torch~=2.9.1",
    "tqdm>=4.67.1",
    "transformers~=4.55.4",
]

[dependency-groups]
dev = [
    "pre-commit~=3.6.2",
    "ruff~=0.11.13",
]

[tool.uv.sources]
optimum-intel = { git = "https://github.com/huggingface/optimum-intel.git" }
